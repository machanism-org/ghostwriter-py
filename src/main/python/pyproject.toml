[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mgw = "mgw.__main__:gw"

[project]
name = "mgw"
version = "1.4.2.1"
description = "Python wrapper for Ghostwriter"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jpype1>=1.4.0",
]
authors = [
    { name = "Viktor Tovstyi", email = "viktor.tovstyi@gmail.com" }
]

[tool.hatch.build.targets.wheel]
packages = ["mgw"]

# Add your project URLs here
[project.urls]
Homepage = "https://machai.machanism.org/ghostwriter-py/"
Repository = "https://github.com/machanism-org/ghostwriter-py"
Documentation = "https://machai.machanism.org/ghostwriter-py/"
Issues = "https://github.com/machanism-org/ghostwriter-py/issues"

[tool.hatch.build.targets.wheel.force-include]
"mgw/jars/ghostwriter.jar" = "mgw/jars/ghostwriter.jar"
